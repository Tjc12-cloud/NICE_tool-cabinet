<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>NICE科创_工具箱</title>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js">
    </script>
    <style>
        /* ===== 全局变量 & 基础 ===== */
        :root {
            --bg: #f0f4f8;
            --glass-bg: rgba(255, 255, 255, 0.72);
            --card-bg: rgba(255, 255, 255, 0.82);
            --text: #1e293b;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --border: rgba(203, 213, 225, 0.55);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.03);
            --shadow: 0 12px 32px rgba(0, 0, 0, 0.07), 0 4px 12px rgba(0, 0, 0, 0.04);
            --shadow-lg: 0 25px 60px rgba(0, 0, 0, 0.12), 0 8px 20px rgba(0, 0, 0, 0.06);
            --primary: #6366f1;
            --primary-light: #eef0ff;
            --primary-gradient: linear-gradient(135deg, #6366f1, #8b5cf6, #a855f7);
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
            --radius-sm: 12px;
            --radius: 20px;
            --radius-lg: 28px;
            --radius-xl: 36px;
            --transition: 0.35s cubic-bezier(0.23, 1, 0.32, 1);
        }
        [data-theme="dark"] {
            --bg: #0b1120;
            --glass-bg: rgba(15, 23, 42, 0.75);
            --card-bg: rgba(30, 41, 59, 0.85);
            --text: #e2e8f0;
            --text-secondary: #b0bec5;
            --text-muted: #64748b;
            --border: rgba(51, 65, 85, 0.65);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.4);
            --shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
            --shadow-lg: 0 25px 60px rgba(0, 0, 0, 0.6);
            --primary: #818cf8;
            --primary-light: #1e2440;
            --danger: #f87171;
            --success: #34d399;
            --warning: #fbbf24;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
            font-size: 16px;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
            transition: background 0.6s, color 0.6s;
            overflow-x: hidden;
            position: relative;
        }
        body::before,
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background:
                radial-gradient(circle at 20% 50%, rgba(99, 102, 241, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(168, 85, 247, 0.06) 0%, transparent 50%);
            animation: bgShift 12s ease-in-out infinite alternate;
        }
        body::after {
            background:
                radial-gradient(circle at 60% 80%, rgba(139, 92, 246, 0.04) 0%, transparent 50%),
                radial-gradient(circle at 10% 70%, rgba(99, 102, 241, 0.05) 0%, transparent 50%);
            animation: bgShift 15s ease-in-out infinite alternate-reverse;
        }
        @keyframes bgShift {
            0% {
                opacity: 0.4;
                transform: scale(1);
            }
            100% {
                opacity: 0.8;
                transform: scale(1.05);
            }
        }

        .app-container {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px 20px 60px;
        }
        .header {
            text-align: center;
            padding: 32px 20px 20px;
        }
        .header-logo {
            display: inline-block;
            font-size: 2.8rem;
            font-weight: 800;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            animation: float 3s ease-in-out infinite;
            letter-spacing: -0.5px;
        }
        @keyframes float {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-8px);
            }
        }
        .header-subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
            opacity: 0.9;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .header-subtitle .site-master {
            display: inline-block;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 600;
            transition: transform 0.3s ease, filter 0.3s ease;
            cursor: default;
        }
        .header-subtitle .site-master:hover {
            transform: scale(1.08) rotate(-2deg);
            filter: drop-shadow(0 0 8px rgba(99, 102, 241, 0.4));
        }
        .header-stats {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 24px;
            flex-wrap: wrap;
        }
        .stat-item {
            background: var(--glass-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px 24px;
            font-size: 0.95rem;
            color: var(--text-secondary);
            box-shadow: var(--shadow-sm);
            backdrop-filter: blur(12px);
            transition: all var(--transition);
            transform: translateY(0);
        }
        .stat-item:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow);
        }
        .stat-item .stat-num {
            font-weight: 700;
            font-size: 1.3rem;
            color: var(--primary);
            font-family: 'SF Mono', 'Cascadia Code', monospace;
        }

        .dev-notice {
            background: var(--glass-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin: 0 auto 24px;
            max-width: 650px;
            color: var(--text-secondary);
            font-size: 0.9rem;
            padding: 14px 24px;
            text-align: center;
            box-shadow: var(--shadow-sm);
            backdrop-filter: blur(12px);
        }

        .toolbar {
            display: flex;
            gap: 14px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
            margin: 8px 0 24px;
            position: sticky;
            top: 16px;
            z-index: 20;
            padding: 12px 0;
        }
        .toolbar-inner {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
            background: var(--glass-bg);
            border-radius: var(--radius-xl);
            padding: 10px 20px;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            transition: all var(--transition);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 20px;
            border-radius: 32px;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all var(--transition);
            white-space: nowrap;
            font-family: inherit;
            background: transparent;
            color: var(--text);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }
        .btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: currentColor;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .btn:hover::after {
            opacity: 0.08;
        }
        .btn:active {
            transform: scale(0.96);
            transition: 0.1s;
        }
        .btn-primary {
            background: var(--primary-gradient);
            color: #fff;
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
            font-weight: 600;
        }
        .btn-primary:hover {
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.6);
            transform: translateY(-2px);
        }
        .btn-outline {
            background: var(--card-bg);
            border: 1px solid var(--border);
        }
        .btn-outline:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--primary-light);
            transform: translateY(-2px);
        }
        .btn-sm {
            padding: 8px 16px;
            font-size: 0.8rem;
            border-radius: 28px;
        }
        .btn-icon {
            width: 42px;
            height: 42px;
            padding: 0;
            border-radius: 50%;
            justify-content: center;
            font-size: 1.15rem;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text);
            backdrop-filter: blur(12px);
            transition: all var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-icon:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }
        .btn:disabled {
            opacity: 0.55;
            pointer-events: none;
        }

        .search-wrapper {
            position: relative;
            flex: 1;
            min-width: 180px;
            max-width: 440px;
        }
        .search-input {
            width: 100%;
            padding: 14px 20px 14px 48px;
            border-radius: 32px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text);
            font-size: 0.95rem;
            transition: all var(--transition);
            outline: none;
            font-family: inherit;
            backdrop-filter: blur(12px);
        }
        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        }
        .search-input::placeholder {
            color: var(--text-muted);
        }
        .search-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }
        .search-input:focus~.search-icon {
            color: var(--primary);
        }
        .search-clear {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 1.1rem;
            padding: 6px;
            border-radius: 50%;
            display: none;
        }
        .search-clear.visible {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .search-clear:hover {
            color: var(--danger);
        }

        .more-menu-wrapper {
            position: relative;
        }
        .more-menu {
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 10px;
            background: var(--glass-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            padding: 8px;
            min-width: 190px;
            z-index: 50;
            display: none;
            flex-direction: column;
            gap: 6px;
            backdrop-filter: blur(24px);
            animation: menuIn 0.25s ease;
        }
        @keyframes menuIn {
            from {
                opacity: 0;
                transform: translateY(-8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .more-menu.open {
            display: flex;
        }
        .more-menu .btn {
            width: 100%;
            justify-content: flex-start;
            padding: 12px 16px;
        }

        .sort-select {
            padding: 10px 18px;
            border-radius: 30px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text);
            font-size: 0.85rem;
            outline: none;
            font-family: inherit;
            cursor: pointer;
            backdrop-filter: blur(10px);
        }

        .category-tabs {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 24px 0 32px;
        }
        .category-tab {
            padding: 12px 26px;
            border-radius: 34px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.88rem;
            font-weight: 500;
            transition: all var(--transition);
            white-space: nowrap;
            user-select: none;
            backdrop-filter: blur(12px);
            position: relative;
            overflow: hidden;
        }
        .category-tab::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 34px;
            background: var(--primary-gradient);
            opacity: 0;
            transition: opacity 0.3s;
            z-index: -1;
        }
        .category-tab:hover {
            color: var(--primary);
            border-color: var(--primary);
            transform: translateY(-2px);
        }
        .category-tab.active {
            color: #fff;
            border-color: transparent;
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.45);
            font-weight: 600;
        }
        .category-tab.active::before {
            opacity: 1;
        }
        .category-tab .tab-count {
            display: inline-block;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 14px;
            padding: 2px 12px;
            font-size: 0.8rem;
            margin-left: 8px;
            font-weight: 600;
        }
        .category-tab.active .tab-count {
            background: rgba(255, 255, 255, 0.35);
        }

        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
            min-height: 300px;
        }

        .tool-card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 26px 22px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            cursor: pointer;
            transition: all 0.45s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 14px;
            color: inherit;
            overflow: hidden;
            backdrop-filter: blur(16px);
            transform: translateY(0) scale(1);
            animation: cardAppear 0.6s cubic-bezier(0.22, 1, 0.36, 1) backwards;
        }
        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .tool-card:nth-child(1) {
            animation-delay: 0.04s;
        }
        .tool-card:nth-child(2) {
            animation-delay: 0.08s;
        }
        .tool-card:nth-child(3) {
            animation-delay: 0.12s;
        }
        .tool-card:nth-child(4) {
            animation-delay: 0.16s;
        }
        .tool-card:nth-child(5) {
            animation-delay: 0.2s;
        }
        .tool-card:nth-child(6) {
            animation-delay: 0.24s;
        }
        .tool-card:nth-child(7) {
            animation-delay: 0.28s;
        }
        .tool-card:nth-child(8) {
            animation-delay: 0.32s;
        }

        .tool-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: var(--radius-lg);
            background: linear-gradient(135deg, transparent 30%, rgba(99, 102, 241, 0.1) 100%);
            opacity: 0;
            transition: opacity 0.45s;
        }
        .tool-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: -150%;
            width: 150%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.7s;
        }
        .tool-card:hover::after {
            left: 150%;
        }
        .tool-card:hover::before {
            opacity: 1;
        }
        .tool-card:hover {
            transform: translateY(-10px) scale(1.03);
            box-shadow: 0 35px 70px rgba(0, 0, 0, 0.15), 0 12px 24px rgba(0, 0, 0, 0.08);
            border-color: var(--primary);
        }
        .tool-card:active {
            transform: scale(0.96);
            transition: 0.1s;
        }

        .tool-card .card-number {
            position: absolute;
            top: 14px;
            left: 16px;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-muted);
            background: var(--glass-bg);
            padding: 2px 10px;
            border-radius: 20px;
            border: 1px solid var(--border);
            backdrop-filter: blur(6px);
            opacity: 0.7;
            transition: opacity 0.3s;
        }
        .tool-card:hover .card-number {
            opacity: 1;
        }

        .tool-card .card-icon {
            font-size: 3.2rem;
            line-height: 1;
            transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
            margin-top: 6px;
        }
        .tool-card:hover .card-icon {
            transform: scale(1.2) rotate(-10deg);
        }
        .tool-card .card-name {
            font-weight: 700;
            font-size: 1.15rem;
            color: var(--text);
        }
        .tool-card .card-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .tool-card .card-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 6px;
        }
        .tool-card .card-category {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 500;
            background: var(--primary-light);
            color: var(--primary);
        }
        /* ===== 用户端只保留复制按钮 ===== */
        .tool-card .card-actions {
            position: absolute;
            top: 16px;
            right: 16px;
            display: flex;
            gap: 8px;
            opacity: 0;
            transform: translateY(-6px);
            transition: all 0.3s;
            z-index: 2;
        }
        .tool-card:hover .card-actions {
            opacity: 1;
            transform: translateY(0);
        }
        .card-action-btn {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--card-bg);
            cursor: pointer;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            box-shadow: var(--shadow-sm);
            transition: all 0.2s;
            backdrop-filter: blur(10px);
        }
        .card-action-btn:hover {
            background: var(--primary-light);
            color: var(--primary);
            border-color: var(--primary);
            transform: scale(1.12);
        }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-muted);
            grid-column: 1 / -1;
        }
        .empty-state .empty-icon {
            font-size: 6rem;
            display: block;
            margin-bottom: 24px;
            animation: float 4s ease-in-out infinite;
        }

        .toast-container {
            position: fixed;
            top: 28px;
            right: 28px;
            z-index: 200;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .toast {
            padding: 16px 28px;
            border-radius: var(--radius);
            color: #fff;
            font-size: 0.9rem;
            font-weight: 500;
            box-shadow: var(--shadow-lg);
            animation: toastIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            max-width: 400px;
            backdrop-filter: blur(24px);
        }
        .toast.success {
            background: rgba(16, 185, 129, 0.92);
        }
        .toast.error {
            background: rgba(239, 68, 68, 0.92);
        }
        .toast.info {
            background: rgba(99, 102, 241, 0.92);
        }
        .toast.warning {
            background: rgba(245, 158, 11, 0.92);
        }
        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateX(90px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateX(0) scale(1);
            }
        }
        @keyframes toastOut {
            from {
                opacity: 1;
                transform: translateX(0) scale(1);
            }
            to {
                opacity: 0;
                transform: translateX(90px) scale(0.9);
            }
        }

        .footer {
            text-align: center;
            padding: 40px 20px 30px;
            color: var(--text-muted);
            font-size: 0.8rem;
            line-height: 1.8;
        }
        .footer .copyright {
            font-weight: 500;
            color: var(--text-secondary);
        }
        .footer .site-master-footer {
            display: inline-block;
            margin-top: 4px;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 600;
            transition: transform 0.3s ease, filter 0.3s ease;
            cursor: default;
        }
        .footer .site-master-footer:hover {
            transform: scale(1.06);
            filter: drop-shadow(0 0 6px rgba(99, 102, 241, 0.3));
        }

        /* ===== 响应式设计：手机竖屏优化 ===== */
        @media (max-width: 640px) {
            .app-container {
                padding: 12px 12px 80px;
            }
            .header {
                padding: 20px 10px 12px;
            }
            .header-logo {
                font-size: 2rem;
            }
            .header-subtitle {
                font-size: 0.85rem;
                gap: 4px;
            }
            .header-stats {
                gap: 12px;
                margin-top: 16px;
            }
            .stat-item {
                padding: 10px 16px;
                font-size: 0.8rem;
                border-radius: 16px;
            }
            .stat-item .stat-num {
                font-size: 1.1rem;
            }
            .dev-notice {
                font-size: 0.8rem;
                padding: 10px 16px;
                margin-bottom: 16px;
            }
            .toolbar {
                margin: 4px 0 16px;
                padding: 6px 0;
            }
            .toolbar-inner {
                border-radius: 28px;
                padding: 8px 12px;
                gap: 8px;
                flex-wrap: wrap;
                justify-content: center;
            }
            .search-wrapper {
                min-width: 120px;
                flex-basis: 100%;
                max-width: 100%;
            }
            .search-input {
                padding: 12px 16px 12px 40px;
                font-size: 0.85rem;
            }
            .search-icon {
                left: 14px;
                font-size: 0.9rem;
            }
            .sort-select {
                font-size: 0.75rem;
                padding: 8px 12px;
            }
            .btn {
                font-size: 0.75rem;
                padding: 6px 14px;
            }
            .btn-sm {
                padding: 6px 12px;
                font-size: 0.7rem;

    <script>
        (function() {
            // ======================== 预设工具（含编号） ========================
            // ★ 已更新在线量角器链接为 https://nice-tool-cabinet.pages.dev/
            const PRESET_TOOLS = [
                { id: 'preset-1', number: 1, name: '在线量角器', url: 'https://nice-tool-cabinet.pages.dev/', description: '在线角度测量工具，可拖动旋转测量角度', category: '📐 测量工具',

                { id: 'preset-3', number: 2, name: '在线尺子', url: 'https://screenruler.online/zh', description: '屏幕在线测量，厘米/英寸刻度尺', category: '📐 测量工具',

                { id: 'preset-4', number: 4, name: '图片压缩工具', url: 'https://docsmall.com/image-compress', description: '在线图片压缩，支持多种格式，减小文件体积', category: '🖼️ 图片处理',

                { id: 'preset-5', number: 5, name: 'Remove.bg', url: 'https://www.remove.bg/', description: 'AI自动抠图，一键去除图片背景', category: '🖼️ 图片处理',
                    icon: '✂️', isPreset: true, clickCount: 0, createdAt: '2025-01-01' },
                { id: 'preset-6', number: 6, name: 'Photopea', url: 'https://www.photopea.com/', description: '在线版Photoshop，强大的图片编辑工具', category: '🖼️ 图片处理',
                    icon: '🎨', isPreset: true, clickCount: 0, createdAt: '2025-01-01' },
                { id: 'preset-7', number: 7, name: 'JSON格式化', url: 'https://www.json.cn/', description: 'JSON在线解析、格式化、校验工具', category: '💻 开发工具',
                    icon: '📋', isPreset: true, clickCount: 0, createdAt: '2025-01-01' },
                { id: 'preset-8', number: 8, name: '正则表达式', url: 'https://www.jyshare.com/front-end/854/', description: '在线正则表达式测试与调试，支持多种语言', category: '💻 开发工具',
                    icon: '🧩', isPreset: true, clickCount: 0, createdAt: '2025-01-01' },
                { id: 'preset-9', number: 9, name: 'Can I Use', url: 'https://caniuse.com/', description: '查询浏览器兼容性，前端开发必备', category: '💻 开发工具',
                    icon: '🌐', isPreset: true, clickCount: 0, createdAt: '2025-01-01' },
                { id: 'preset-11', number: 10, name: '在线OCR识别', url: 'https://ocr.wdku.net/', description: '图片转文字，免费在线OCR识别工具', category: '📄 文档工具',
                    icon: '📝', isPreset: true, clickCount: 0, createdAt: '2025-01-01' },
                { id: 'preset-13', number: 11, name: 'CSS渐变生成器', url: 'https://cssgradient.io/', description: '可视化生成CSS渐变代码，支持多种渐变类型', category: '🎯 设计工具',
                    icon: '🌈', isPreset: true, clickCount: 0, createdAt: '2025-01-01' },
                { id: 'preset-14', number: 12, name: '在线屏幕录制', url: 'https://www.fuwa.org/tools/screen-recorder.html', description: '免费在线录屏，无需安装软件',
                    category: '🎬 媒体工具', icon: '🎥', isPreset: true, clickCount: 0, createdAt: '2025-01-01' },
                { id: 'preset-15', number: 13, name: 'Online Video Cutter', url: 'https://online-video-cutter.com/', description: '在线视频剪辑、裁剪，支持多种格式',
                    category: '🎬 媒体工具', icon: '✂️', isPreset: true, clickCount: 0, createdAt: '2025-01-01' },
                { id: 'preset-16', number: 14, name: '二维码生成器', url: 'https://go-tools.org/zh/tools/qr-code-generator#google_vignette',
                    description: '在线生成二维码，支持文本、网址等', category: '📱 二维码工具', icon: '🔳', isPreset: true, clickCount: 0, createdAt: '2025-01-01' },
                { id: 'preset-17', number: 15, name: '二维码扫描器', url: 'https://www.xyutil.com/qrcode-scanner/zh/', description: '在线扫描二维码，识别内容',
                    category: '📱 二维码工具', icon: '📷', isPreset: true, clickCount: 0, createdAt: '2025-01-01' },
                { id: 'preset-18', number: 16, name: 'PDF压缩', url: 'https://www.freeconvert.com/zh-CN/compress-pdf', description: '在线压缩PDF文件，减小文件大小',
                    category: '📄 文档工具', icon: '📦', isPreset: true, clickCount: 0, createdAt: '2025-01-01' },
                { id: 'preset-19', number: 17, name: 'PDF转换', url: 'https://smallpdf.com/cn/pdf-converter', description: '在线PDF格式转换，支持多种格式互转',
                    category: '📄 文档工具', icon: '🔄', isPreset: true, clickCount: 0, createdAt: '2025-01-01' },
                { id: 'preset-21', number: 18, name: '激光切割盒子生成器', url: 'https://box-studio.cc/en/app', description: '在线设计并生成激光切割盒子图纸',
                    category: '🎯 设计工具', icon: '📦', isPreset: true, clickCount: 0, createdAt: '2025-01-01' },
                { id: 'preset-22', number: 19, name: '临时邮箱', url: 'https://tempmail.ing/zh-CN/', description: '一次性临时邮箱，保护隐私，接收验证码', category: '📱 临时工具',
                    icon: '📧', isPreset: true, clickCount: 0, createdAt: '2025-01-01' },
                { id: 'preset-23', number: 20, name: '临时号码', url: 'https://receive-sms.io/zh/', description: '临时接收短信验证码，保护个人手机号', category: '📱 临时工具',
                    icon: '📱', isPreset: true, clickCount: 0, createdAt: '2025-01-01' }
            ];

            const STORAGE_KEY = 'nice_tech_toolbox_data';
            const THEME_KEY = 'nice_tech_toolbox_theme';
            const CLICK_COUNTS_KEY = 'nice_tech_toolbox_click_counts';
            const SERVER_DATA_FILE = './tools-data.json';

            let tools = [];
            let currentCategory = '全部';
            let searchQuery = '';

            const $ = id => document.getElementById(id);
            const $toolsGrid = $('toolsGrid'),
                $categoryTabs = $('categoryTabs'),
                $searchInput = $('searchInput');
            const $searchClear = $('searchClear'),
                $emptyState = $('emptyState');
            const $totalCount = $('totalCount'),
                $categoryCount = $('categoryCount'),
                $totalClicks = $('totalClicks');
            const $sortOrder = $('sortOrder');
            const $btnMore = $('btnMore'),
                $moreMenu = $('moreMenu');
            const $themeToggle = $('themeToggle');
            const $toastContainer = $('toastContainer');
            const $btnExport = $('btnExport'),
                $btnSyncLoad = $('btnSyncLoad');

            // ========== 初始化 ==========
            async function init() {
                loadTheme();
                // ★ 强制从预设加载（忽略旧缓存，保留点击计数）
                loadDataFromLocal();
                renderAll();
                updateStats();
                bindEvents();
            }

            // ========== 主题 ==========
            function loadTheme() {
                const saved = localStorage.getItem(THEME_KEY);
                const isDark = saved === 'dark' || (!saved && window.matchMedia?.('(prefers-color-scheme: dark)').matches);
                document.documentElement.toggleAttribute('data-theme', isDark);
                updateThemeIcon(isDark);
            }

            function saveTheme() {
                const isDark = document.documentElement.hasAttribute('data-theme');
                localStorage.setItem(THEME_KEY, isDark ? 'dark' : 'light');
                updateThemeIcon(isDark);
            }

            function updateThemeIcon(isDark) {
                $themeToggle.querySelector('.icon-sun').style.display = isDark ? 'inline' : 'none';
                $themeToggle.querySelector('.icon-moon').style.display = isDark ? 'none' : 'inline';
            }

            // ========== 数据加载（强制预设） ==========
            function loadClickCounts() {
                try { return JSON.parse(localStorage.getItem(CLICK_COUNTS_KEY) || '{}'); } catch { return {}; }
            }

            function loadDataFromLocal() {
                // ★ 总是从预设开始，并合并保存的点击计数
                const counts = loadClickCounts();
                tools = JSON.parse(JSON.stringify(PRESET_TOOLS));
                tools.forEach(t => { if (counts[t.id] !== undefined) t.clickCount = counts[t.id]; });
                // 保存合并后的数据到 localStorage（覆盖旧数据）
                saveDataToLocal();
            }

            function saveDataToLocal() {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(tools));
                saveClickCounts();
            }

            function saveClickCounts() {
                const counts = {};
                tools.forEach(t => counts[t.id] = t.clickCount || 0);
                localStorage.setItem(CLICK_COUNTS_KEY, JSON.stringify(counts));
            }

            // 手动从服务器同步（保留原有功能）
            async function syncFromServer() {
                try {
                    const response = await fetch(SERVER_DATA_FILE + '?t=' + Date.now());
                    if (!response.ok) throw new Error('文件不存在');
                    const serverTools = await response.json();
                    if (!Array.isArray(serverTools)) throw new Error('格式错误');
                    if (serverTools.length === 0) { showToast('⚠️ 服务器数据为空', 'warning'); return; }
                    // 合并服务器数据，但保留本地点击计数
                    const localClicks = loadClickCounts();
                    tools = serverTools.map(t => ({ ...t, clickCount: localClicks[t.id] || 0 }));
                    saveDataToLocal();
                    renderAll();
                    updateStats();
                    showToast('🔄 已同步服务器列表 (' + tools.length + ' 个)', 'success');
                } catch (e) {
                    showToast('⚠️ 无法获取服务器数据', 'error');
                }
            }

            // ========== 分类与过滤 ==========
            function getAllCategories() {
                const cats = new Set();
                tools.forEach(t => { if (t.category?.trim()) cats.add(t.category.trim()); });
                const ordered = ['📐 测量工具', '🖼️ 图片处理', '💻 开发工具', '📄 文档工具', '🎯 设计工具', '🎬 媒体工具', '📱 二维码工具', '📱 临时工具'];
                const result = [];
                ordered.forEach(c => { if (cats.has(c)) { result.push(c);
                        cats.delete(c); } });
                cats.forEach(c => result.push(c));
                return result;
            }

            function getFilteredTools() {
                let filtered = [...tools];
                if (currentCategory !== '全部') filtered = filtered.filter(t => (t.category || '').trim() === currentCategory);
                if (searchQuery.trim()) {
                    const q = searchQuery.trim().toLowerCase();
                    let numMatch = null;
                    if (/^\d+$/.test(q)) {
                        numMatch = parseInt(q, 10);
                    } else if (/^#\d+$/.test(q)) {
                        numMatch = parseInt(q.slice(1), 10);
                    }
                    filtered = filtered.filter(t => {
                        const matchText =
                            t.name.toLowerCase().includes(q) ||
                            (t.description || '').toLowerCase().includes(q) ||
                            (t.category || '').toLowerCase().includes(q) ||
                            (t.url || '').toLowerCase().includes(q);
                        if (matchText) return true;
                        if (numMatch !== null && t.number === numMatch) return true;
                        return false;
                    });
                }
                const order = $sortOrder.value;
                if (order === 'number') {
                    filtered.sort((a, b) => (a.number || 0) - (b.number || 0));
                } else if (order === 'name-asc') {
                    filtered.sort((a, b) => a.name.localeCompare(b.name));
                } else if (order === 'name-desc') {
                    filtered.sort((a, b) => b.name.localeCompare(a.name));
                } else if (order === 'clicks') {
                    filtered.sort((a, b) => (b.clickCount || 0) - (a.clickCount || 0));
                }
                return filtered;
            }

            // ========== 渲染 ==========
            function renderAll() { renderCategoryTabs();
                renderTools();
                updateStats(); }

            function renderCategoryTabs() {
                const categories = getAllCategories();
                let html =
                    `<button class="category-tab${currentCategory === '全部' ? ' active' : ''}" data-category="全部">全部<span class="tab-count">${tools.length}</span></button>`;
                categories.forEach(cat => {
                    const count = tools.filter(t => (t.category || '').trim() === cat).length;
                    html +=
                        `<button class="category-tab${currentCategory === cat ? ' active' : ''}" data-category="${escapeHTML(cat)}">${escapeHTML(cat)}<span class="tab-count">${count}</span></button>`;
                });
                $categoryTabs.innerHTML = html;
                $categoryTabs.querySelectorAll('.category-tab').forEach(tab => {
                    tab.addEventListener('click', () => {
                        currentCategory = tab.dataset.category;
                        renderAll();
                    });
                });
            }

            function renderTools() {
                const filtered = getFilteredTools();
                if (filtered.length === 0) {
                    $toolsGrid.innerHTML = '';
                    $emptyState.style.display = 'block';
                } else {
                    $emptyState.style.display = 'none';
                    $toolsGrid.innerHTML = filtered.map(tool => createToolCardHTML(tool)).join('');
                }
            }

            function createToolCardHTML(tool) {
                const numberDisplay = tool.number ? `#${tool.number}` : '';
                return `
            <div class="tool-card" data-tool-id="${tool.id}">
                <div class="card-number">${numberDisplay}</div>
                <div class="card-actions">
                    <button class="card-action-btn copy-btn" data-tool-id="${tool.id}" title="复制链接">📋</button>
                </div>
                <span class="card-icon">${tool.icon || '🔧'}</span>
                <span class="card-name">${escapeHTML(tool.name)}</span>
                <span class="card-desc">${escapeHTML(tool.description || '暂无描述')}</span>
                <div class="card-meta">
                    <span class="card-category">${escapeHTML(tool.category || '未分类')}</span>
                    <span class="click-count">🖱️ ${tool.clickCount || 0}</span>
                </div>
            </div>`;
            }

            function updateStats() {
                $totalCount.textContent = tools.length;
                $categoryCount.textContent = getAllCategories().length;
                $totalClicks.textContent = tools.reduce((sum, t) => sum + (t.clickCount || 0), 0);
            }

            // ========== 事件绑定 ==========
            function bindEvents() {
                $searchInput.addEventListener('input', debounce(() => {
                    searchQuery = $searchInput.value;
                    $searchClear.classList.toggle('visible', !!searchQuery.trim());
                    renderTools();
                }, 300));
                $searchClear.addEventListener('click', () => { $searchInput.value = '';
                    searchQuery = '';
                    $searchClear.classList.remove('visible');
                    renderTools();
                    $searchInput.focus(); });

                $sortOrder.addEventListener('change', renderTools);

                $btnMore.addEventListener('click', (e) => { e.stopPropagation();
                    $moreMenu.classList.toggle('open'); });
                document.addEventListener('click', (e) => { if (!$moreMenu.contains(e.target) && e.target !== $btnMore) $moreMenu
                        .classList.remove('open'); });

                $themeToggle.addEventListener('click', toggleTheme);

                $btnExport.addEventListener('click', handleExport);
                $btnSyncLoad.addEventListener('click', syncFromServer);

                // 卡片点击 - 跳转链接 + 复制
                $toolsGrid.addEventListener('click', (e) => {
                    const card = e.target.closest('.tool-card');
                    if (!card) return;
                    const btn = e.target.closest('.card-action-btn');
                    const toolId = card.dataset.toolId;
                    if (btn) {
                        e.stopPropagation();
                        handleCopyLink(toolId);
                    } else {
                        handleToolClick(toolId);
                    }
                });

                document.addEventListener('keydown', e => {
                    if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault();
                        $searchInput.focus();
                        $searchInput.select(); }
                    if (e.key === '?' && !e.ctrlKey && !e.metaKey) { showToast('快捷键: Ctrl+K 搜索, ? 帮助', 'info'); }
                });

                window.matchMedia?.('(prefers-color-scheme: dark)').addEventListener('change', e => {
                    if (!localStorage.getItem(THEME_KEY)) {
                        document.documentElement.toggleAttribute('data-theme', e.matches);
                        updateThemeIcon(e.matches);
                    }
                });
            }

            // ========== 工具操作 ==========
            function handleToolClick(toolId) {
                const tool = tools.find(t => t.id === toolId);
                if (!tool) return;
                tool.clickCount = (tool.clickCount || 0) + 1;
                saveClickCounts();
                updateStats();
                renderTools();
                let url = tool.url.trim();
                if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
                window.open(url, '_blank', 'noopener,noreferrer');
            }

            function handleCopyLink(toolId) {
                const tool = tools.find(t => t.id === toolId);
                if (!tool) return;
                let url = tool.url.trim();
                if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
                navigator.clipboard.writeText(url).then(() => showToast('✅ 链接已复制', 'success')).catch(() => showToast(
                    '❌ 复制失败', 'error'));
            }

            // ========== 导出 ==========
            function handleExport() {
                const blob = new Blob([JSON.stringify(tools, null, 2)], { type: 'application/json' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `NICE科创工具箱备份_${new Date().toISOString().slice(0,10)}.json`;
                a.click();
                showToast('📥 导出成功', 'success');
            }

            // ========== 主题切换 ==========
            function toggleTheme() {
                const isDark = !document.documentElement.hasAttribute('data-theme');
                document.documentElement.toggleAttribute('data-theme', isDark);
                saveTheme();
            }

            // ========== Toast ==========
            function showToast(msg, type = 'info') {
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                toast.textContent = msg;
                $toastContainer.appendChild(toast);
                setTimeout(() => {
                    toast.style.animation = 'toastOut 0.3s ease forwards';
                    toast.addEventListener('animationend', () => toast.remove());
                }, 2500);
            }

            // ========== 工具函数 ==========
            function debounce(fn, delay) {
                let timer;
                return function(...args) {
                    clearTimeout(timer);
                    timer = setTimeout(() => fn.apply(this, args), delay);
                };
            }

            function escapeHTML(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            // ========== 启动 ==========
            init();
        })();
    </script>
</body>
</html>
